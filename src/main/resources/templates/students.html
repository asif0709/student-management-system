<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Management</title><link rel="stylesheet" href="/style.css"></head><body><main class="container"><header><div><h1>Student Management System</h1><p>Spring Boot + MySQL</p></div><a class="button" href="/students/new">+ Add Student</a></header><form class="search" method="get" action="/"><input name="search" th:value="${search}" placeholder="Search by name"><button>Search</button><a href="/">Clear</a></form><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th><th>Year</th><th>Actions</th></tr></thead><tbody><tr th:each="s : ${students}"><td th:text="${s.id}"></td><td th:text="${s.name}"></td><td th:text="${s.email}"></td><td th:text="${s.course}"></td><td th:text="${s.year}"></td><td><a th:href="@{/students/edit/{id}(id=${s.id})}">Edit</a> <a class="delete" th:href="@{/students/delete/{id}(id=${s.id})}" onclick="return confirm('Delete this student?')">Delete</a></td></tr></tbody></table></main></body></html>
