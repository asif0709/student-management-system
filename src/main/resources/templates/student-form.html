<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Form</title><link rel="stylesheet" href="/style.css"></head><body><main class="form"><h1 th:text="${student.id == null ? 'Add Student' : 'Edit Student'}"></h1><form th:action="@{/students/save}" th:object="${student}" method="post"><input type="hidden" th:field="*{id}"><label>Name</label><input th:field="*{name}" required><label>Email</label><input type="email" th:field="*{email}" required><label>Course</label><input th:field="*{course}" required><label>Year</label><input type="number" th:field="*{year}" min="1" max="6" required><button>Save Student</button> <a href="/">Cancel</a></form></main></body></html>
